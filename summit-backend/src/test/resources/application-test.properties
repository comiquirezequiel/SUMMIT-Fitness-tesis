# Configuración de los tests automáticos (./mvnw.cmd test): usan una base aparte, summit_test, en el mismo MySQL que
# la de desarrollo (con el usuario y la contraseña de application-local.properties). Se crea sola al empezar y se borra
# al terminar: los tests nunca tocan la base de desarrollo. Además, cada test deshace lo que hizo.
spring.datasource.url=jdbc:mysql://localhost:3306/summit_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Clave de prueba para firmar los tokens (solo sirve para los tests)
jwt.secret=clave-de-prueba-solo-para-los-tests-automaticos-no-sirve-para-nada-mas

# Los archivos (certificados, fotos, logo) de los tests van a target/, que se borra al compilar de cero
summit.uploads.dir=target/uploads-test

# Nada que salga de la PC: sin IA, sin Mercado Pago y sin la sincronización de los débitos
summit.ia.habilitada=false
summit.pagos.mp.sincronizar-ms=86400000
# Cobro con tarjeta contra el simulador de Mercado Pago; la revisión de los pagos en proceso la llama cada test
summit.pagos.tarjeta.modo=SIMULADOR
summit.pagos.tarjeta.revisar-ms=86400000

logging.level.root=WARN
logging.level.com.summit=WARN
# Al arrancar, create-drop intenta borrar un esquema que en una base nueva no existe: no es un error
logging.level.org.hibernate.tool.schema=ERROR

# Factura electrónica contra el simulador de ARCA (adentro del backend): los tests nunca llaman a ARCA. Los reintentos
# automáticos no corren: cada test procesa la cola cuando quiere
summit.arca.habilitada=true
summit.arca.ambiente=SIMULADOR
summit.arca.reintentos-ms=86400000
