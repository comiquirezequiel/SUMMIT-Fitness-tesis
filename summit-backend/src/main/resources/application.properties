# Server Port
server.port=8080

# Valores privados de cada máquina (contraseñas y clave de los tokens): NO van en este archivo, que se sube
# al repositorio, sino en application-local.properties, que no se sube (.gitignore). Se crea copiando
# application-local.properties.example (ver README). Cada valor también se puede dar como variable de
# entorno con el mismo nombre (por ejemplo, en un servidor), que tiene prioridad sobre el archivo.
spring.config.import=optional:classpath:application-local.properties

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/summit_fitness_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# El dialecto de MySQL lo detecta Hibernate solo (MySQL8Dialect está deprecado).
spring.jpa.hibernate.ddl-auto=update
# Para ver el SQL que se manda a la base mientras se desarrolla, poner show-sql en true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Explícito para que no avise al arrancar: algunas pantallas leen datos relacionados (por ejemplo, el plan de una
# membresía) después de la consulta, mientras se arma la respuesta
spring.jpa.open-in-view=true
# JSON con los valores por defecto de Jackson 2, que es como lo arma y lo lee el panel (por ejemplo, un dato que no
# viene en el pedido queda en false o en null en lugar de rechazar el pedido)
spring.jackson.use-jackson2-defaults=true

# JWT Config
# jwt.secret: clave con la que se firman los tokens de sesión (JWT_SECRET, mínimo 48 caracteres).
# Si cambia, las sesiones abiertas dejan de valer y hay que volver a entrar.
jwt.secret=${JWT_SECRET}
# jwt.expiration: duración del token del personal, en milisegundos (86400000 = 24 h)
jwt.expiration=86400000

# "¿Olvidaste tu contraseña?" por email (opcional). Sin MAIL_HOST o sin APP_URL el login no ofrece la opción, y
# la contraseña la restablece recepción o el admin con una temporal. Los valores van en
# application-local.properties (ver el .example).
# app.url: dirección con la que se entra al panel (por ejemplo https://summit.local). Es la del link del mail.
summit.app.url=${APP_URL:}
# recuperacion.minutos: cuánto vale el link del mail (sirve una sola vez).
summit.recuperacion.minutos=30
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# mail.remitente: con qué dirección sale el mail (vacío = MAIL_USERNAME).
summit.mail.remitente=${MAIL_REMITENTE:}
# Conexión cifrada (STARTTLS, puerto 587): la contraseña del correo nunca viaja sin cifrar.
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Si el servidor de correo no responde, se deja de esperar a los 10 segundos.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Tareas programadas (limpiezas, débito automático, seguimiento, facturación): varias a la vez, así una que
# tarda (por ejemplo, esperando a Mercado Pago) no frena a las demás.
spring.task.scheduling.pool.size=3

# IP real del cliente detras de un proxy (nginx, balanceador): X-Forwarded-For solo se acepta si el
# pedido llega desde una IP interna (localhost o red privada). Lo usa el limitador de pedidos.
server.forward-headers-strategy=native

# Origenes que pueden llamar a la API desde el navegador (separados por coma).
# Al publicar el sistema, poner aca la direccion real del frontend.
summit.cors.origins=http://localhost:5173,http://localhost:3000

# Carpeta donde se guardan los archivos subidos (certificados médicos y fotos de los socios). Contiene datos de
# salud y personales: está excluida del repositorio (.gitignore) y no debe compartirse.
summit.uploads.dir=uploads

# Asistente de IA local (Ollama): lee certificados medicos y sugiere ejercicios a evitar.
# Corre en la propia maquina (los datos de salud no salen del gimnasio). Si Ollama no esta corriendo,
# el resto del sistema funciona igual y los botones de IA avisan que no esta disponible.
# habilitada: interruptor general (false apaga la IA sin recompilar).
summit.ia.habilitada=true
# url: donde escucha Ollama ("ollama serve" usa el puerto 11434 por defecto).
summit.ia.url=http://localhost:11434
# modelo: gemma4:12b (texto + imagenes). Elegido tras comparar con llama3 (leia mal la fecha y no lee
# imagenes) y llama3.2-vision (no carga en Ollama 0.31). Se puede cambiar por otro modelo descargado.
summit.ia.modelo=gemma4:12b
# timeout-segundos: espera maxima de una respuesta (un certificado tarda 20-60 s).
summit.ia.timeout-segundos=180

# Admin inicial: DataSeeder lo crea solo si no existe ningún usuario ADMIN (instalación nueva).
# La contraseña es ADMIN_PASSWORD: si está vacía, el admin no se crea (y el log lo avisa).
summit.seed.admin.email=admin@summit.com
summit.seed.admin.password=${ADMIN_PASSWORD:}
summit.seed.admin.dni=00000000

# ===============================================
# BLINDAJE ANTI-SATURACION
# ===============================================

# HikariCP - Pool de conexiones blindado
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Limites de tamaño de request HTTP (evita payload bombing)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-swallow-size=2MB

# Paginacion por defecto
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# Scheduling habilitado (para limpieza periodica del RateLimitingFilter)
spring.main.allow-bean-definition-overriding=true

# ===============================================
# DEBITO AUTOMATICO MENSUAL (Mercado Pago Suscripciones) - opcional para el socio
# ===============================================
# access-token: credencial PRIVADA de la cuenta de Mercado Pago del gimnasio (permite cobrar en su nombre).
# NUNCA se escribe aca: va en MP_ACCESS_TOKEN (application-local.properties o variable de entorno). Vacia = debito automatico
# apagado (las pantallas lo explican) y el resto del sistema funciona igual.
summit.pagos.mp.access-token=${MP_ACCESS_TOKEN:}
summit.pagos.mp.url=https://api.mercadopago.com
# back-url: adonde vuelve el socio despues de autorizar en Mercado Pago (tiene que ser https).
summit.pagos.mp.back-url=${MP_BACK_URL:https://www.mercadopago.com.ar}
# sincronizar-ms: cada cuanto se consulta a Mercado Pago si hubo cobros nuevos (3600000 = 1 hora).
summit.pagos.mp.sincronizar-ms=3600000

# ===============================================
# COBRO CON TARJETA EN RECEPCION (Mercado Pago Checkout API) - opcional
# ===============================================
# tarjeta.modo: APAGADO, SIMULADOR (para probar y mostrar sin cuenta: el titular APRO aprueba, CONT queda en proceso,
# FUND/SECU/EXPI/OTHE rechazan, como las tarjetas de prueba de Mercado Pago) o MERCADO_PAGO (con MP_PUBLIC_KEY y
# MP_ACCESS_TOKEN de la cuenta del gimnasio).
summit.pagos.tarjeta.modo=${MP_TARJETA:APAGADO}
# public-key: la clave pública del formulario de tarjeta (no es secreta: la usa el navegador).
summit.pagos.mp.public-key=${MP_PUBLIC_KEY:}
# tarjeta.revisar-ms: cada cuánto se le pregunta a Mercado Pago por los pagos con tarjeta que quedaron en proceso
# (300000 = 5 minutos).
summit.pagos.tarjeta.revisar-ms=300000

# ===============================================
# FACTURA ELECTRONICA DE ARCA (opcional, ver FACTURACION.md)
# ===============================================
# habilitada: con false (o vacía) no se factura nada y el panel no muestra la sección. Se prende con
# ARCA_HABILITADA=true en application-local.properties.
summit.arca.habilitada=${ARCA_HABILITADA:false}
# ambiente: SIMULADOR (un ARCA de mentira dentro del backend, para probar y mostrar sin certificado: las facturas no
# valen nada), HOMOLOGACION (el ambiente de pruebas de ARCA) o PRODUCCION (facturas reales). Va en ARCA_AMBIENTE.
summit.arca.ambiente=${ARCA_AMBIENTE:SIMULADOR}
# certificado: ruta al archivo .p12 con el certificado de ARCA y su clave privada, FUERA del repositorio (por ejemplo
# C:/ProgramData/Summit/arca/summit-arca.p12, con barras /). Van en ARCA_CERTIFICADO y ARCA_CERTIFICADO_PASSWORD. En
# el simulador no hacen falta.
summit.arca.certificado=${ARCA_CERTIFICADO:}
summit.arca.certificado-password=${ARCA_CERTIFICADO_PASSWORD:}
# reintentos-ms: cada cuánto se revisa si hay facturas esperando un reintento (60000 = 1 minuto). Cada una espera 1, 5,
# 15 y después 60 minutos entre intentos.
summit.arca.reintentos-ms=60000
