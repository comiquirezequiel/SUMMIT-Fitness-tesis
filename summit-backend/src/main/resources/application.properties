# Server Port
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/summit_fitness_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=QUITADO-DEL-HISTORIAL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Config
jwt.secret=QUITADO-DEL-HISTORIAL
jwt.expiration=86400000

# IP real del cliente detras de un proxy (nginx, balanceador): X-Forwarded-For solo se acepta si el
# pedido llega desde una IP interna (localhost o red privada). Lo usa el limitador de pedidos.
server.forward-headers-strategy=native

# Origenes que pueden llamar a la API desde el navegador (separados por coma).
# Al publicar el sistema, poner aca la direccion real del frontend.
summit.cors.origins=http://localhost:5173,http://localhost:3000

# Carpeta donde se guardan los archivos subidos (certificados médicos). Contiene datos de salud:
# está excluida del repositorio (.gitignore) y no debe compartirse.
summit.uploads.dir=uploads

# Asistente de IA local (Ollama): lee certificados medicos y sugiere ejercicios a evitar.
# Corre en la propia maquina (los datos de salud no salen del gimnasio). Si Ollama no esta corriendo,
# el resto del sistema funciona igual y los botones de IA avisan que no esta disponible.
# habilitada: interruptor general (false apaga la IA sin recompilar).
summit.ia.habilitada=true
# url: donde escucha Ollama ("ollama serve" usa el puerto 11434 por defecto).
summit.ia.url=http://localhost:11434
# modelo: gemma4:12b (texto + imagenes). Elegido tras comparar con llama3 (leia mal la fecha y no lee
# imagenes) y llama3.2-vision (no carga en Ollama 0.31). Se puede cambiar por otro modelo descargado.
summit.ia.modelo=gemma4:12b
# timeout-segundos: espera maxima de una respuesta (un certificado tarda 20-60 s).
summit.ia.timeout-segundos=180

# Admin inicial: DataSeeder lo crea solo si no existe ningún usuario ADMIN (instalación nueva).
# Valores de desarrollo: cambiá la contraseña después del primer login.
summit.seed.admin.email=admin@summit.com
summit.seed.admin.password=QUITADO-DEL-HISTORIAL
summit.seed.admin.dni=00000000

# ===============================================
# BLINDAJE ANTI-SATURACION
# ===============================================

# HikariCP - Pool de conexiones blindado
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Limites de tamaño de request HTTP (evita payload bombing)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-swallow-size=2MB

# Paginacion por defecto
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# Scheduling habilitado (para limpieza periodica del RateLimitingFilter)
spring.main.allow-bean-definition-overriding=true
