# Server Port
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/summit_fitness_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=QUITADO-DEL-HISTORIAL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Config
jwt.secret=QUITADO-DEL-HISTORIAL
jwt.expiration=86400000

# ===============================================
# BLINDAJE ANTI-SATURACION
# ===============================================

# HikariCP - Pool de conexiones blindado
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Limites de tamaño de request HTTP (evita payload bombing)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-swallow-size=2MB

# Paginacion por defecto
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# Scheduling habilitado (para limpieza periodica del RateLimitingFilter)
spring.main.allow-bean-definition-overriding=true
