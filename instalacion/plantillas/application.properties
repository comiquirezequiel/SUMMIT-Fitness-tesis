# =================================================================================================================
# Configuración privada de SUMMIT en la PC del gimnasio
# =================================================================================================================
# Tiene contraseñas: solo lo pueden leer los administradores de Windows y el servicio SUMMIT-Backend. No lo copies a
# otra PC ni lo subas a internet (tampoco a GitHub).
#
# Lo lee el backend al arrancar porque está en la carpeta "config" al lado de summit-backend.jar: Spring Boot busca
# config\application.properties en la carpeta donde arranca y estos valores pisan a los de adentro del programa.
# Después de cambiar algo, reiniciá el servicio SUMMIT-Backend (services.msc > SUMMIT-Backend > Reiniciar).

# --- Base de datos: usuario propio de SUMMIT con permisos solo sobre su base (lo completa crear-usuarios-mysql.ps1)
DB_USERNAME=summit_app
DB_PASSWORD=

# --- Clave con la que se firman las sesiones (la genera preparar-pc.ps1 al azar). Si cambia, todos vuelven a entrar.
JWT_SECRET=

# --- Contraseña del administrador inicial (admin@summit.com). Solo se usa la primera vez, con la base vacía, y al
# entrar el sistema pide cambiarla. La genera preparar-pc.ps1; después de ese primer ingreso se puede borrar.
ADMIN_PASSWORD=

# --- Red: el backend solo atiende pedidos de esta misma PC. Las otras PC entran por Caddy (servicio SUMMIT-Web),
# que muestra la app y le pasa al backend lo que empieza con /api.
server.address=127.0.0.1
server.port=8080

# --- Archivos subidos (certificados médicos y fotos). Tiene que coincidir con CarpetaUploads de config\summit.psd1,
# que es la carpeta que guardan las copias de seguridad.
summit.uploads.dir=C:/SUMMIT/datos/uploads

# --- Producción: sin el detalle de cada consulta SQL en el registro
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Al detener el servicio, el backend termina lo que estaba haciendo (hasta 20 segundos) antes de cerrarse
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Opcionales (sacá el # para usarlos; se explican en application-local.properties.example del código)
# "¿Olvidaste tu contraseña?" por email:
#MAIL_HOST=smtp.gmail.com
#MAIL_PORT=587
#MAIL_USERNAME=
#MAIL_PASSWORD=
#APP_URL=https://summit.local
# Débito automático con Mercado Pago:
#MP_ACCESS_TOKEN=
# Cobro con tarjeta en recepción (con la clave pública de la misma cuenta; el panel tiene que abrirse con https):
#MP_TARJETA=MERCADO_PAGO
#MP_PUBLIC_KEY=
# Sin Ollama, o si la PC tiene menos de 16 GB de RAM, apagá el asistente de IA:
#summit.ia.habilitada=false
