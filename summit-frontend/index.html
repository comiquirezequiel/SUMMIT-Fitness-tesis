<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4A0B1B" />
    <meta name="description" content="SUMMIT: socios, cobros, clases, rutinas y control de acceso del gimnasio." />
    <title>SUMMIT</title>
    <script>
      // Modo oscuro antes de pintar la página (ver src/services/tema.js)
      try {
        var tema = localStorage.getItem('summit.tema');
        if (tema === 'oscuro' || (!tema && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
