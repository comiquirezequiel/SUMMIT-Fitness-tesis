<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <!-- Íconos: se generan con npm run generar-iconos (pwa-assets.config.js) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- viewport-fit=cover: la app instalada ocupa toda la pantalla y el portal deja libre la zona de la
         barra inferior del iPhone con env(safe-area-inset-bottom) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4A0B1B" />
    <!-- App instalada en el iPhone: nombre bajo el ícono, y barra de estado transparente sobre el encabezado
         bordó del portal y del login (los dos dejan libre env(safe-area-inset-top)) -->
    <meta name="apple-mobile-web-app-title" content="SUMMIT" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="SUMMIT: socios, clases, rutinas y control de acceso del gimnasio." />
    <title>SUMMIT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
