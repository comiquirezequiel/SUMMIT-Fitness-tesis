# Nombre de la aplicación
spring.application.name=summit-fitness

# Conexión a la base de datos MySQL
# El flag createDatabaseIfNotExist=true le dice a MySQL que cree el esquema si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/summit_fitness?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=granziok
spring.datasource.password=REDACTADO
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 'update' lee las clases de Java y crea/modifica las tablas en MySQL automáticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


